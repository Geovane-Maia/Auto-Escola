<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autoescola Renascer — Simulados ABCDETRAN</title>
  <style>
/* =========================================================
   Auto Escola ABCDETRAN — tema ABCDETRAN (guia oficial)
   Paleta extraída do layout:
   Verde Entrar  #34A14C / esc #237A36 · Laranja Confirmar #E67F24 / esc #B95F0E
   Azul Avançar  #2F66AC / esc #1D4A86 · Fundo #EFF3F5
   Zona Contexto #C3E6C5 · Zona Decisão #FCE0A6 · Zona Navegação #A9C6E6
   Aviso vermelho #C62828 · Título azul-escuro #1E3A5F
   ========================================================= */
:root {
  --verde: #34a14c;
  --verde-esc: #237a36;
  --verde-header: #2a7d3a;
  --verde-header-esc: #1c5c28;
  --verde-claro: #c3e6c5;
  --verde-claro-borda: #8fc795;
  --laranja: #e67f24;
  --laranja-esc: #b95f0e;
  --laranja-claro: #fde0ae;
  --azul: #2f66ac;
  --azul-esc: #1d4a86;
  --azul-claro: #a9c6e6;
  --azul-titulo: #1e3a5f;
  --bege: #fce0a6;
  --bege-borda: #e9bd6b;
  --fundo: #eff3f5;
  --card: #ffffff;
  --texto: #1e1e1e;
  --texto-suave: #6b7280;
  --borda: #d9dee3;
  --tecla-cinza: #d7d9dd;
  --tecla-texto: #6e747d;
  --erro: #c62828;
  --ok: #237a36;
  --amarelo-detran: #f5b301;
  --sombra: 0 6px 18px rgba(30, 58, 95, .12);
  --raio: 10px;
  /* compatibilidade com código antigo (vermelho/amarelo/preto) */
  --vermelho: #34a14c;
  --vermelho-esc: #237a36;
  --amarelo: #e67f24;
  --amarelo-esc: #b95f0e;
  --preto: #1e3a5f;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: var(--fundo);
  color: var(--texto);
  min-height: 100vh;
}

.erro { color: var(--erro); display: block; margin: 6px 0 10px; font-size: .88rem; }

/* ---------- Botões padrão ABCDETRAN ----------
   Verde = Entrar / Confirmar Início (→)
   Laranja = Confirmar Resposta (✓) — o mais importante, trava a escolha
   Azul = Avançar (→ / >) — move para próxima pergunta */
.btn {
  display: inline-block;
  border: none;
  border-bottom: 4px solid rgba(0,0,0,.25);
  border-radius: 8px;
  padding: 13px 22px;
  font-size: 1rem;
  font-weight: 800;
  letter-spacing: .3px;
  cursor: pointer;
  transition: transform .12s ease, filter .12s ease;
  text-decoration: none;
  text-align: center;
  box-shadow: 0 4px 10px rgba(0,0,0,.15);
}
.btn:hover { filter: brightness(1.06); }
.btn:active { transform: translateY(2px); border-bottom-width: 2px; }

.btn-primario { background: var(--verde); border-bottom-color: var(--verde-esc); color: #fff; width: 100%; }
.btn-primario:hover { background: var(--verde); }

.btn-secundario { background: #e4e7ea; border-bottom-color: #b9bfc6; color: var(--texto); box-shadow: 0 4px 10px rgba(0,0,0,.08); }
.btn-secundario:hover { background: #d6dade; }

.btn-perigo { background: var(--erro); border-bottom-color: #7f1b1b; color: #fff; }
.btn-perigo:hover { filter: brightness(1.08); }

.btn-pequeno { padding: 7px 12px; font-size: .82rem; border-radius: 6px; border-bottom-width: 3px; }

.btn-link {
  background: none; border: none; box-shadow: none; cursor: pointer;
  color: var(--azul-titulo); font-size: .85rem; text-decoration: underline; font-weight: 600;
}
.btn-link:hover { color: var(--azul); }

/* ---------- Inputs ---------- */
input[type="text"], input[type="password"], input[type="number"], select, textarea {
  width: 100%;
  padding: 12px 14px;
  border: 1.5px solid var(--borda);
  border-radius: 8px;
  font-size: 1rem;
  background: #fff;
  color: var(--texto);
  transition: border-color .15s;
}
input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--azul);
  box-shadow: 0 0 0 3px rgba(47, 102, 172, .15);
}
label { display: block; font-size: .9rem; font-weight: 600; margin: 14px 0 6px; color: var(--texto); }

/* =========================================================
   LOGIN — Passo 1: Identificação Exclusiva por CPF
   Faixa "Digite seu CPF" verde-clara · teclas cinza ·
   << laranja · → verde
   ========================================================= */
.page-login {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  background: radial-gradient(ellipse at center, #ffffff 0%, var(--fundo) 55%, #d4d9de 100%);
  padding: 24px;
  min-height: 100vh;
}
.login-wrap { width: 100%; max-width: 400px; }
.login-card {
  background: var(--card);
  border-radius: var(--raio);
  box-shadow: var(--sombra);
  padding: 0 0 26px;
  overflow: hidden;
  border: 1px solid var(--borda);
}
.login-topo {
  background: linear-gradient(90deg, var(--verde-header), var(--verde-header-esc));
  color: #fff;
  padding: 16px 24px;
  display: flex; align-items: center; gap: 12px;
}
.login-topo .logo-img { height: 64px; width: auto; flex-shrink: 0; border-radius: 8px; }
.login-topo h1 { font-size: 1.1rem; font-weight: 700; }
.login-topo p { font-size: .75rem; color: #fff; letter-spacing: .5px; opacity: .9; }

.login-corpo { padding: 22px 24px 0; }
.login-corpo .titulo-digitos {
  text-align: center; font-weight: 700; color: #2c4a2e;
  background: var(--verde-claro);
  margin: -22px -24px 12px;
  padding: 12px;
  font-size: .95rem;
}

.cpf-display {
  background: #f4f5f7;
  border: 2px solid var(--borda);
  border-radius: 8px;
  padding: 14px;
  text-align: center;
  font-size: 1.5rem;
  font-weight: 700;
  letter-spacing: 6px;
  color: var(--texto);
  min-height: 58px;
  margin-bottom: 14px;
  font-variant-numeric: tabular-nums;
}
.cpf-display.vazio { color: #b8bdc2; letter-spacing: 3px; font-size: 1.2rem; }

.teclado {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  background: #eef0f2;
  padding: 6px;
  border-radius: 10px;
  border: 1px solid var(--borda);
}
.tecla {
  padding: 15px 0;
  font-size: 1.25rem;
  font-weight: 600;
  border: 1px solid #c6c9ce;
  border-bottom: 3px solid #aeb3b9;
  border-radius: 6px;
  background: var(--tecla-cinza);
  color: var(--tecla-texto);
  cursor: pointer;
  transition: filter .1s, transform .08s;
  user-select: none;
}
.tecla:hover { filter: brightness(.96); }
.tecla:active { transform: translateY(2px); border-bottom-width: 1px; }
.tecla.apagar { background: var(--laranja); border-bottom-color: var(--laranja-esc); color: #fff; font-weight: 800; }
.tecla.entrar { background: var(--verde); border-bottom-color: var(--verde-esc); color: #fff; font-weight: 800; }

.login-ajuda { text-align: center; color: var(--texto-suave); font-size: .8rem; margin-top: 16px; padding: 0 10px; }
.login-contato { text-align: center; color: var(--texto-suave); font-size: .8rem; margin-top: 12px; line-height: 1.6; }

/* ---------- Leitura em áudio ---------- */
.btn-audio {
  position: fixed; right: 18px; bottom: 18px; z-index: 200;
  width: 56px; height: 56px; border-radius: 50%;
  border: none; border-bottom: 4px solid var(--verde-esc);
  background: var(--verde); font-size: 24px; cursor: pointer;
  box-shadow: 0 4px 12px rgba(0, 0, 0, .25);
  transition: transform .1s, filter .12s;
}
.btn-audio:hover { filter: brightness(1.08); }
.btn-audio:active { transform: translateY(2px); border-bottom-width: 2px; }
.btn-audio.tocando { background: var(--laranja); border-bottom-color: var(--laranja-esc); }

/* ---------- Acessibilidade ---------- */
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
}
.cartao-resp { position: relative; }
.login-footer { text-align: center; margin-top: 16px; }

/* =========================================================
   BARRA SUPERIOR — verde DETRAN + ABCDETRAN à direita
   ========================================================= */
.topo {
  background: linear-gradient(90deg, var(--verde-header), var(--verde-header-esc));
  color: #fff;
  box-shadow: 0 2px 8px rgba(0, 0, 0, .25);
  position: sticky; top: 0; z-index: 50;
  border-bottom: 3px solid var(--laranja);
}
.topo-inner {
  max-width: 1080px; margin: 0 auto;
  padding: 9px 20px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.topo-inner::after { content: 'ABCDETRAN'; font-size: .75rem; font-weight: 700; letter-spacing: 1px; opacity: .9; position: absolute; right: 20px; top: 4px; display: none; }
.marca { display: flex; align-items: center; gap: 10px; text-decoration: none; color: #fff; }
.marca .mini-logo { height: 34px; width: auto; flex-shrink: 0; border-radius: 6px; }
.marca strong { font-size: 1.05rem; }
.topo-acoes { display: flex; align-items: center; gap: 12px; }
.topo-usuario { font-size: .88rem; color: rgba(255,255,255,.9); }

.container { max-width: 1080px; margin: 0 auto; padding: 28px 20px 60px; }

/* =========================================================
   MODAL
   ========================================================= */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(20, 30, 25, .55);
  display: flex; align-items: center; justify-content: center;
  z-index: 100; padding: 16px;
}
.modal-overlay[hidden] { display: none; }
.modal {
  background: var(--card);
  border-radius: var(--raio);
  box-shadow: var(--sombra);
  padding: 26px;
  width: 100%; max-width: 440px;
  max-height: 90vh; overflow-y: auto;
  border-top: 5px solid var(--verde);
}
.modal h2 { color: var(--azul-titulo); font-size: 1.2rem; margin-bottom: 4px; }
.modal-acoes { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
.modal-acoes .btn { width: auto; }

/* =========================================================
   PAINEL DO ALUNO — Passo 2: Confirmação + Seleção do Caderno
   Box boas-vindas com borda azul-clara · card caderno com
   ícone livro amarelo
   ========================================================= */
.box-boas-vindas {
  background: var(--card);
  border: 2px solid #5aa9d6;
  border-radius: var(--raio);
  padding: 16px 20px;
  margin-bottom: 26px;
  box-shadow: var(--sombra);
}
.box-boas-vindas h1 { font-size: 1.05rem; margin-bottom: 6px; color: var(--azul-titulo); }
.box-boas-vindas ul { list-style: none; }
.box-boas-vindas li { font-size: .85rem; color: var(--texto-suave); margin-top: 3px; }
.box-boas-vindas li strong { color: var(--texto); }

.secao { margin-bottom: 34px; }
.secao-titulo { font-size: 1.05rem; color: var(--azul-titulo); margin-bottom: 14px; border-left: 4px solid var(--verde); padding-left: 10px; }

.grade-cadernos {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
  gap: 16px;
}
.card-caderno {
  background: var(--card);
  border: 1px solid var(--borda);
  border-bottom: 4px solid var(--laranja);
  border-radius: var(--raio);
  padding: 24px 18px;
  text-align: center;
  cursor: pointer;
  box-shadow: 0 3px 10px rgba(0, 0, 0, .06);
  transition: transform .15s, box-shadow .15s, border-color .15s;
  text-decoration: none;
  color: var(--texto);
  display: block;
}
.card-caderno:hover { transform: translateY(-3px); box-shadow: var(--sombra); border-bottom-color: var(--verde); }
.card-caderno .icone-caderno { font-size: 2.6rem; margin-bottom: 10px; display: block; color: #eab308; }
.card-caderno h3 { font-size: 1rem; color: var(--texto); margin-bottom: 4px; }
.card-caderno .tipo { font-size: .78rem; color: var(--texto-suave); text-transform: uppercase; letter-spacing: .5px; }
.card-caderno .qtd { display: inline-block; margin-top: 10px; background: #e8f3ea; color: var(--verde-esc); font-size: .78rem; font-weight: 700; padding: 4px 12px; border-radius: 20px; }

/* caderno único — maior, com botão começar */
.card-caderno-unico { max-width: 340px; margin: 0 auto; padding: 34px 26px; }
.card-caderno-unico .icone-caderno { font-size: 3.4rem; }
.card-caderno-unico h3 { font-size: 1.25rem; }
.btn-comecar {
  display: block;
  margin-top: 16px;
  background: var(--laranja);
  border-bottom: 4px solid var(--laranja-esc);
  color: #fff;
  border-radius: 8px;
  padding: 13px 0;
  font-weight: 800;
  font-size: .95rem;
  letter-spacing: 1px;
  transition: filter .12s;
  box-shadow: 0 4px 10px rgba(230, 127, 36, .35);
}
.card-caderno:hover .btn-comecar { filter: brightness(1.08); }

.vazio { color: var(--texto-suave); background: var(--card); border: 1px dashed var(--borda); border-radius: var(--raio); padding: 24px; text-align: center; }

.tabela { width: 100%; border-collapse: collapse; background: var(--card); border-radius: var(--raio); overflow: hidden; box-shadow: 0 3px 10px rgba(0,0,0,.06); }
.tabela th, .tabela td { padding: 12px 14px; text-align: left; font-size: .9rem; }
.tabela thead { background: var(--verde-header); color: #fff; }
.tabela tbody tr { border-top: 1px solid var(--borda); }
.tabela tbody tr:nth-child(even) { background: #f4f7f4; }

.situacao { padding: 4px 10px; border-radius: 20px; font-size: .78rem; font-weight: 700; }
.situacao.ok { background: #e5f6ea; color: var(--ok); }
.situacao.ruim { background: #fdecea; color: var(--erro); }

/* =========================================================
   PROVA — Anatomia da Tela (3 zonas)
   Zona Contexto (verde-clara) · Zona Decisão (bege) ·
   Zona Navegação (azul-clara)
   ========================================================= */
.prova-wrap { max-width: 960px; margin: 0 auto; padding: 18px 14px 60px; }

/* cabeçalho verde DETRAN */
.prova-topo {
  background: linear-gradient(90deg, var(--verde-header), var(--verde-header-esc));
  color: #fff;
  border-radius: var(--raio) var(--raio) 0 0;
  padding: 12px 22px;
  display: flex; align-items: center; gap: 20px;
  box-shadow: 0 4px 14px rgba(0, 0, 0, .12);
}
.logo-prova { height: 48px; width: auto; flex-shrink: 0; border-radius: 8px; }
.abcdetran { font-size: .72rem; font-weight: 800; letter-spacing: 1.2px; color: rgba(255,255,255,.95); flex-shrink: 0; }
.contador-topo { flex: 1; text-align: center; }
.contador-topo span { font-weight: 800; color: #fff; letter-spacing: 1.5px; font-size: .95rem; }
.contador-topo span strong { color: var(--amarelo-detran); }
.barra-progresso { height: 9px; background: rgba(255,255,255,.35); border-radius: 9px; margin-top: 8px; overflow: hidden; }
.barra-progresso .fill { height: 100%; background: var(--amarelo-detran); border-radius: 9px; transition: width .3s; }
.timer {
  font-weight: 800; font-size: 1rem;
  background: rgba(0,0,0,.35); color: #fff;
  padding: 8px 14px; border-radius: 8px;
  font-variant-numeric: tabular-nums; flex-shrink: 0;
  border: 1px solid rgba(255,255,255,.3);
}
.timer.pouco { background: var(--erro); animation: pisca 1s infinite alternate; }
@keyframes pisca { from { opacity: 1; } to { opacity: .65; } }

/* Passo 4 — Rede de Segurança: aviso vermelho em pílula */
.aviso-pendencias {
  background: var(--erro);
  border-bottom: 4px solid #7f1b1b;
  color: #fff;
  padding: 12px 20px;
  font-weight: 800;
  text-align: center;
  border-radius: 10px;
  margin: 12px 0;
  box-shadow: 0 4px 12px rgba(198, 40, 40, .35);
}

/* ZONA DE CONTEXTO — enunciado + placa, fundo verde-claro */
.cartao-questao {
  background: var(--verde-claro);
  border: 1px solid var(--verde-claro-borda);
  border-top: none;
  border-radius: 0;
  padding: 28px 30px;
  display: flex; align-items: center; gap: 28px;
  box-shadow: 0 4px 14px rgba(0, 0, 0, .06);
}
.img-questao {
  background: #fff;
  border: 1px solid var(--borda);
  border-radius: 8px;
  padding: 14px;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 3px 10px rgba(0,0,0,.08);
}
.img-questao img { width: 150px; height: 130px; object-fit: contain; border-radius: 6px; }
.cartao-questao .enunciado {
  font-size: 1.1rem; font-weight: 600; color: #1f3d24;
  line-height: 1.5; flex: 1;
  text-transform: uppercase;
  letter-spacing: .3px;
}

/* ZONA DE DECISÃO — fundo bege, quadrados brancos clicáveis */
.grade-respostas {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 18px;
  margin-top: 0;
  background: var(--bege);
  border: 1px solid var(--bege-borda);
  border-top: none;
  padding: 26px 22px;
}
/* Regra de Ouro Passo 1: quadrado branco, selecionado = borda preta pontilhada */
.cartao-resp {
  background: #fff;
  border: 2px solid #d5d9de;
  border-radius: 6px;
  padding: 14px 10px 12px;
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  cursor: pointer;
  font-family: inherit;
  text-align: center;
  box-shadow: 0 3px 8px rgba(0, 0, 0, .08);
  transition: border-color .12s, transform .1s;
  min-height: 170px;
}
.cartao-resp:hover { border-color: var(--azul); transform: translateY(-1px); }
.cartao-resp .letra {
  order: 2;
  width: auto; height: auto;
  background: none; color: #7a3b00;
  border-radius: 0;
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 1rem;
}
.cartao-resp .texto-resp { order: 3; flex: 1; font-weight: 600; color: #4a4438; font-size: .78rem; line-height: 1.35; }
.cartao-resp .radio {
  order: 1;
  width: 100%; height: 86px;
  border: 3px solid #cfd4d9; border-radius: 4px;
  background: #fafbfc;
  display: flex; align-items: center; justify-content: center;
  transition: border-color .12s, background .12s;
}
.cartao-resp .radio::after {
  content: ''; width: 40px; height: 40px; border-radius: 4px;
  background: transparent; transform: scale(0); transition: transform .12s;
  border: none;
}
.cartao-resp.selecionada { border: 3px dashed #111; background: #fff; }
.cartao-resp.selecionada .radio { border-color: #111; background: #fff; border-style: dashed; }
.cartao-resp.selecionada .letra { color: #111; }

/* ZONA DE NAVEGAÇÃO — barra azul-clara com a dupla inseparável */
.barra-acoes {
  display: flex; justify-content: center; gap: 14px; margin-top: 0; flex-wrap: wrap;
  background: var(--azul-claro);
  border: 1px solid #7fa8d0;
  border-top: none;
  border-radius: 0 0 var(--raio) var(--raio);
  padding: 16px;
}
.btn-exame {
  border: none; border-bottom: 4px solid rgba(0,0,0,.3); cursor: pointer; font-family: inherit;
  border-radius: 8px; font-weight: 800; letter-spacing: .5px;
  padding: 16px 28px; font-size: 1rem;
  min-width: 190px;
  transition: transform .1s, filter .12s;
  box-shadow: 0 4px 10px rgba(0,0,0,.2);
  color: #fff;
}
.btn-exame:hover { filter: brightness(1.05); }
.btn-exame:active { transform: translateY(2px); border-bottom-width: 2px; }
.btn-exame:disabled { opacity: .4; cursor: not-allowed; transform: none; }
.btn-anterior { background: #fff; color: var(--azul-esc); border: 2px solid var(--azul-esc); border-bottom: 4px solid var(--azul-esc); min-width: 130px; box-shadow: none; }
/* Passo 2 Confirmar — laranja com ✓ */
.btn-confirmar {
  background: var(--laranja);
  border-bottom-color: var(--laranja-esc);
}
/* Passo 3 Avançar — azul com > */
.btn-proxima {
  background: var(--azul);
  border-bottom-color: var(--azul-esc);
}

/* rodapé de status */
.barra-status { display: flex; justify-content: center; gap: 16px; margin-top: 18px; flex-wrap: wrap; }
.pill {
  background: var(--card);
  border-radius: 10px;
  padding: 10px 18px;
  font-size: .9rem; font-weight: 600; color: var(--texto-suave);
  box-shadow: 0 3px 10px rgba(0,0,0,.06);
  display: inline-flex; align-items: center; gap: 8px;
  border: 1px solid var(--borda);
}
.pill strong { color: var(--azul-titulo); }

/* botão sair do questionário */
.btn-sair-prova,
.btn-sair-simulado {
  background: var(--erro);
  border-bottom: 3px solid #7f1b1b;
  color: #fff;
  border-radius: 6px;
  padding: 8px 14px;
  font-weight: 800;
  font-size: .82rem;
  font-family: inherit;
  cursor: pointer;
  flex-shrink: 0;
  transition: filter .12s, transform .1s;
}
.btn-sair-prova:hover,
.btn-sair-simulado:hover { filter: brightness(1.1); }
.btn-sair-prova:active,
.btn-sair-simulado:active { transform: translateY(2px); border-bottom-width: 1px; }

/* Passo 5 — Linha de Chegada: Disciplina concluída! » */
.tela-conclusao { text-align: center; padding: 10px 0 30px; }
.faixa-concluida {
  background: linear-gradient(90deg, var(--verde-header), var(--verde-header-esc));
  color: #fff;
  font-size: 1.4rem; font-weight: 700;
  padding: 18px;
  border-radius: var(--raio) var(--raio) 0 0;
  margin-bottom: 0;
  box-shadow: var(--sombra);
  border-bottom: 3px solid var(--laranja);
}
.faixa-concluida::after { content: ' »'; color: var(--amarelo-detran); }
.card-resultado { background: var(--card); border-radius: 0 0 var(--raio) var(--raio); box-shadow: var(--sombra); padding: 34px 26px; border: 1px solid var(--borda); border-top: none; }
.nota-grande { font-size: 3.4rem; font-weight: 800; color: var(--verde-esc); }
.resultado-titulo { font-size: 1.3rem; margin: 8px 0; font-weight: 700; }
.resultado-titulo.ok { color: var(--ok); }
.resultado-titulo.ruim { color: var(--erro); }

/* selo APROVADO / REPROVADO */
.selo {
  display: inline-block;
  margin: 6px 0 14px;
  padding: 12px 34px;
  border-radius: 8px;
  border-bottom: 4px solid rgba(0,0,0,.3);
  font-size: 1.7rem;
  font-weight: 900;
  letter-spacing: 2px;
  color: #fff;
  box-shadow: var(--sombra);
}
.selo.aprovado { background: var(--verde); border-bottom-color: var(--verde-esc); }
.selo.reprovado { background: var(--erro); border-bottom-color: #7f1b1b; }
.resultado-detalhes { color: var(--texto-suave); margin-bottom: 24px; }
.resultado-acoes { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.resultado-acoes .btn { width: auto; }

/* gabarito */
.gabarito-item { background: var(--card); border: 1px solid var(--borda); border-radius: 10px; padding: 16px; margin-bottom: 12px; text-align: left; }
.gabarito-item.certo { border-left: 5px solid var(--verde); }
.gabarito-item.errado { border-left: 5px solid var(--erro); }
.gabarito-item h4 { font-size: .95rem; margin-bottom: 8px; }
.gabarito-item p { font-size: .85rem; color: var(--texto-suave); margin: 3px 0; }
.gabarito-item .correto-texto { color: var(--ok); font-weight: 600; }
.gabarito-item .sua-texto { color: var(--erro); font-weight: 600; }

/* chip de categoria (usado no admin) */
.categoria-tag {
  display: inline-block;
  background: #eef4fa; color: var(--azul-titulo);
  border: 1px solid var(--azul-claro);
  font-size: .76rem; font-weight: 700;
  padding: 4px 12px; border-radius: 20px;
}

/* =========================================================
   ADMINISTRAÇÃO
   ========================================================= */
.abas {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 24px;
  border-bottom: 2px solid var(--borda);
  padding-bottom: 10px;
}
.aba {
  background: none;
  border: none;
  box-shadow: none;
  padding: 10px 16px;
  border-radius: 8px;
  font-size: .92rem;
  font-weight: 700;
  color: var(--texto-suave);
  cursor: pointer;
  transition: background .15s, color .15s;
}
.aba:hover { background: #e8f0f8; color: var(--azul); }
.aba.ativa { background: var(--azul); color: #fff; border-bottom: 3px solid var(--azul-esc); }

.barra-ferramentas {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  flex-wrap: wrap;
  margin-bottom: 16px;
}
.barra-ferramentas h2 { color: var(--azul-titulo); font-size: 1.15rem; }
.ferramentas { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.input-busca { width: auto; min-width: 220px; padding: 9px 14px; }

@media (max-width: 640px) {
  .grade-respostas { grid-template-columns: 1fr 1fr; gap: 10px; padding: 16px 12px; }
  .cartao-questao { flex-direction: column; text-align: center; padding: 22px 18px; }
  .cartao-questao .enunciado { font-size: .95rem; }
  .prova-topo { flex-wrap: wrap; gap: 10px; }
  .contador-topo { order: 3; flex-basis: 100%; }
  .btn-exame { padding: 13px 18px; font-size: .9rem; min-width: 0; flex: 1; }
  .barra-acoes { flex-direction: column; }
  .input-busca { min-width: 0; width: 100%; }
  .barra-ferramentas { flex-direction: column; align-items: stretch; }
  .ferramentas { flex-direction: column; align-items: stretch; }
}

</style>

/* =========================================================
   ABCDETRAN — Camada de dados
   Usa Supabase (Postgres + REST) quando configurado em
   js/config.js; caso contrário, localStorage (fallback).
   Todas as funções são async.
   ========================================================= */
const DB = (() => {
  const S = window.SUPABASE || {};
  const temNuvem = Boolean(S.url && S.anonKey);
  const K = { alunos: 'qx_alunos', admins: 'qx_admins', perguntas: 'qx_perguntas', resultados: 'qx_resultados' };

  function uid() {
    return (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2, 10));
  }

  function lerLocal(k, pad) {
    try { const r = localStorage.getItem(k); return r ? JSON.parse(r) : pad; } catch { return pad; }
  }
  function gravarLocal(k, v) { localStorage.setItem(k, JSON.stringify(v)); }

  /* ---------- REST Supabase ---------- */
  async function api(metodo, caminho, corpo) {
    const r = await fetch(S.url.replace(/\/$/, '') + '/rest/v1/' + caminho, {
      method: metodo,
      headers: {
        'apikey': S.anonKey,
        'Authorization': 'Bearer ' + S.anonKey,
        'Content-Type': 'application/json',
        'Prefer': metodo === 'GET' ? 'return=representation' : 'return=representation'
      },
      body: corpo ? JSON.stringify(corpo) : undefined
    });
    if (!r.ok) {
      const txt = await r.text().catch(() => '');
      throw new Error('Banco ' + r.status + ': ' + txt.slice(0, 200));
    }
    return r.status === 204 ? [] : r.json();
  }

  /* Versão do banco: troca integral ao mudar (ex.: simulado final) */
  const VERSAO_BANCO = 'sindcfcs-50';
  const K_VERSAO = 'qx_seed_versao';

  /* Banco vigente: Simulado Final em js/banco-questoes.js */
  function todasSeed() {
    return (typeof PERGUNTAS_NOVAS !== 'undefined' && Array.isArray(PERGUNTAS_NOVAS)) ? PERGUNTAS_NOVAS : [];
  }

  async function apagaTudoNuvem() {
    const todas = await api('GET', 'perguntas?select=id');
    for (let i = 0; i < todas.length; i += 10) {
      await Promise.all(todas.slice(i, i + 10).map(p => api('DELETE', 'perguntas?id=eq.' + encodeURIComponent(p.id))));
    }
  }

  async function insereTudoNuvem() {
    const todas = todasSeed();
    for (let i = 0; i < todas.length; i += 20) {
      await api('POST', 'perguntas', todas.slice(i, i + 20).map(p => ({ id: uid(), ...p })));
    }
  }

  /* ---------- seed ---------- */
  async function seed() {
    const CPF_TESTE = '11111111111';
    if (!temNuvem) {
      if (!localStorage.getItem(K.admins)) {
        gravarLocal(K.admins, [{ id: uid(), usuario: 'admin', senha: 'admin123', nome: 'Administrador', criadoEm: new Date().toISOString() }]);
      }
      // troca integral do banco quando a versão muda (remove as anteriores)
      if (lerLocal(K_VERSAO, '') !== VERSAO_BANCO) {
        gravarLocal(K.perguntas, todasSeed().map(p => ({ id: uid(), ...p })));
        gravarLocal(K_VERSAO, VERSAO_BANCO);
      }
      // CPF padrão de teste com perfil Administrador
      const alunosLocal = lerLocal(K.alunos, []);
      if (!alunosLocal.some(a => a.cpf === CPF_TESTE)) {
        alunosLocal.push({ id: uid(), nome: 'Administrador', cpf: CPF_TESTE, turma: 'Administrador', ativo: true, criado_em: new Date().toISOString() });
        gravarLocal(K.alunos, alunosLocal);
      }
      return;
    }
    // remoto: só popula se vazio
    const admins = await api('GET', 'admins?select=id');
    if (!admins.length) {
      await api('POST', 'admins', [{ id: uid(), usuario: 'admin', senha: 'admin123', nome: 'Administrador' }]);
    }
    // CPF padrão de teste com perfil Administrador (nuvem)
    const alunoTeste = await api('GET', 'alunos?select=id&cpf=eq.' + CPF_TESTE);
    if (!alunoTeste.length) {
      await api('POST', 'alunos', [{ id: uid(), nome: 'Administrador', cpf: CPF_TESTE, turma: 'Administrador', ativo: true }]);
    }
    // troca integral do banco quando a versão muda (remove as anteriores)
    if (lerLocal(K_VERSAO, '') !== VERSAO_BANCO) {
      await apagaTudoNuvem();
      await insereTudoNuvem();
      gravarLocal(K_VERSAO, VERSAO_BANCO);
    }
  }

  /* ---------- alunos ---------- */
  const alunos = {
    async all() {
      if (temNuvem) return api('GET', 'alunos?select=*&order=criado_em.asc');
      return lerLocal(K.alunos, []);
    },
    async findByCpf(cpf) {
      if (temNuvem) { const r = await api('GET', 'alunos?select=*&cpf=eq.' + encodeURIComponent(cpf)); return r[0] || null; }
      return lerLocal(K.alunos, []).find(a => a.cpf === cpf) || null;
    },
    async create(d) {
      const a = { id: uid(), nome: d.nome.trim(), cpf: d.cpf, turma: (d.turma || '').trim(), ativo: d.ativo !== false, criado_em: new Date().toISOString() };
      if (temNuvem) return (await api('POST', 'alunos', a))[0];
      const l = lerLocal(K.alunos, []); l.push(a); gravarLocal(K.alunos, l); return a;
    },
    async update(id, d) {
      const dados = { ...d };
      if (typeof dados.nome === 'string') dados.nome = dados.nome.trim();
      if (temNuvem) return (await api('PATCH', 'alunos?id=eq.' + encodeURIComponent(id), dados))[0] || null;
      const l = lerLocal(K.alunos, []); const i = l.findIndex(a => a.id === id);
      if (i === -1) return null;
      l[i] = { ...l[i], ...dados }; gravarLocal(K.alunos, l); return l[i];
    },
    async remove(id) {
      if (temNuvem) { await api('DELETE', 'alunos?id=eq.' + encodeURIComponent(id)); return; }
      gravarLocal(K.alunos, lerLocal(K.alunos, []).filter(a => a.id !== id));
    }
  };

  /* ---------- admins ---------- */
  const admins = {
    async all() {
      if (temNuvem) return api('GET', 'admins?select=*');
      return lerLocal(K.admins, []);
    },
    async login(usuario, senha) {
      if (temNuvem) {
        const r = await api('GET', 'admins?select=id&usuario=eq.' + encodeURIComponent(usuario) + '&senha=eq.' + encodeURIComponent(senha));
        return r.length > 0;
      }
      return lerLocal(K.admins, []).some(a => a.usuario === usuario && a.senha === senha);
    },
    async find(usuario) {
      if (temNuvem) { const r = await api('GET', 'admins?select=*&usuario=eq.' + encodeURIComponent(usuario)); return r[0] || null; }
      return lerLocal(K.admins, []).find(a => a.usuario === usuario) || null;
    },
    async updateSenha(usuario, nova) {
      if (temNuvem) { await api('PATCH', 'admins?usuario=eq.' + encodeURIComponent(usuario), { senha: nova }); return true; }
      const l = lerLocal(K.admins, []); const i = l.findIndex(a => a.usuario === usuario);
      if (i > -1) { l[i].senha = nova; gravarLocal(K.admins, l); return true; }
      return false;
    }
  };

  /* ---------- perguntas ---------- */
  const perguntas = {
    async all() {
      if (temNuvem) return api('GET', 'perguntas?select=*');
      return lerLocal(K.perguntas, []);
    },
    async byCategoria(cat) {
      const l = await perguntas.all();
      return cat === 'todas' ? l : l.filter(p => p.categoria === cat);
    },
    async create(d) {
      const p = { id: uid(), ...d };
      if (temNuvem) return (await api('POST', 'perguntas', p))[0];
      const l = lerLocal(K.perguntas, []); l.push(p); gravarLocal(K.perguntas, l); return p;
    },
    async update(id, d) {
      if (temNuvem) return (await api('PATCH', 'perguntas?id=eq.' + encodeURIComponent(id), d))[0] || null;
      const l = lerLocal(K.perguntas, []); const i = l.findIndex(p => p.id === id);
      if (i === -1) return null;
      l[i] = { ...l[i], ...d }; gravarLocal(K.perguntas, l); return l[i];
    },
    async remove(id) {
      if (temNuvem) { await api('DELETE', 'perguntas?id=eq.' + encodeURIComponent(id)); return; }
      gravarLocal(K.perguntas, lerLocal(K.perguntas, []).filter(p => p.id !== id));
    },
    async categorias() {
      const l = await perguntas.all();
      return [...new Set(l.map(p => p.categoria))];
    }
  };

  /* ---------- resultados ---------- */
  const resultados = {
    async all() {
      if (temNuvem) return api('GET', 'resultados?select=*&order=data.desc');
      return lerLocal(K.resultados, []);
    },
    async criar(r) {
      const item = { id: uid(), data: new Date().toISOString(), ...r };
      if (temNuvem) return (await api('POST', 'resultados', item))[0];
      const l = lerLocal(K.resultados, []); l.push(item); gravarLocal(K.resultados, l); return item;
    },
    async porCpf(cpf) {
      if (temNuvem) return api('GET', 'resultados?select=*&cpf=eq.' + encodeURIComponent(cpf) + '&order=data.desc');
      return lerLocal(K.resultados, []).filter(r => r.cpf === cpf).sort((a, b) => b.data.localeCompare(a.data));
    },
    async remove(id) {
      if (temNuvem) { await api('DELETE', 'resultados?id=eq.' + encodeURIComponent(id)); return; }
      gravarLocal(K.resultados, lerLocal(K.resultados, []).filter(r => r.id !== id));
    },
    async limpar() {
      if (temNuvem) {
        const todos = await resultados.all();
        for (const r of todos) await api('DELETE', 'resultados?id=eq.' + encodeURIComponent(r.id));
        return;
      }
      gravarLocal(K.resultados, []);
    },
    /* backup/export — só local (nuvem usa o próprio Supabase) */
    async substituirTodos(list) {
      if (temNuvem) throw new Error('Importação disponível apenas no modo local.');
      gravarLocal(K.resultados, list);
    }
  };

  return { seed, alunos, admins, perguntas, resultados, uid, temNuvem };
})();

/* =========================================================
   ABCDETRAN — Autenticação (CPF + sessão)
   ========================================================= */

/* ---------- CPF ---------- */
function cpfSomenteDigitos(cpf) {
  return (cpf || '').replace(/\D/g, '');
}

function validaCPF(cpf) {
  const c = cpfSomenteDigitos(cpf);
  // CPF de teste do administrador (acesso liberado para testes)
  if (c === '11111111111') return true;
  if (c.length !== 11) return false;
  if (/^(\d)\1{10}$/.test(c)) return false; // 000.000.000-00 etc.

  let soma = 0;
  for (let i = 0; i < 9; i++) soma += parseInt(c[i], 10) * (10 - i);
  let d1 = (soma * 10) % 11;
  if (d1 === 10) d1 = 0;
  if (d1 !== parseInt(c[9], 10)) return false;

  soma = 0;
  for (let i = 0; i < 10; i++) soma += parseInt(c[i], 10) * (11 - i);
  let d2 = (soma * 10) % 11;
  if (d2 === 10) d2 = 0;
  return d2 === parseInt(c[10], 10);
}

function formataCPF(cpf) {
  const c = cpfSomenteDigitos(cpf).slice(0, 11);
  return c
    .replace(/(\d{3})(\d)/, '$1.$2')
    .replace(/(\d{3})\.(\d{3})(\d)/, '$1.$2.$3')
    .replace(/\.(\d{3})(\d{1,2})$/, '.$1-$2');
}

/* ---------- Sessão ---------- */
const Auth = {
  KEY: 'qx_sessao',

  alunoLogado() {
    try {
      const s = JSON.parse(sessionStorage.getItem(this.KEY) || 'null');
      return s && s.tipo === 'aluno' ? s : null;
    } catch { return null; }
  },

  adminLogado() {
    try {
      const s = JSON.parse(sessionStorage.getItem(this.KEY) || 'null');
      return s && s.tipo === 'admin' ? s : null;
    } catch { return null; }
  },

  loginAluno(aluno) {
    sessionStorage.setItem(this.KEY, JSON.stringify({
      tipo: 'aluno', id: aluno.id, nome: aluno.nome, cpf: aluno.cpf
    }));
  },

  loginAdmin(admin) {
    sessionStorage.setItem(this.KEY, JSON.stringify({
      tipo: 'admin', id: admin.id, nome: admin.nome, usuario: admin.usuario
    }));
  },

  logout() {
    sessionStorage.removeItem(this.KEY);
  },

  exigeAluno() {
    const s = this.alunoLogado();
    if (!s) { window.location.href = 'index.html'; return null; }
    return s;
  },

  exigeAdmin() {
    const s = this.adminLogado();
    if (!s) { window.location.href = 'index.html?admin=1'; return null; }
    return s;
  }
};

</script>
  <script>
/* =========================================================
   ABCDETRAN — index.html (login com teclado virtual)
   ========================================================= */
(async () => {
  await DB.seed();

  /* se já estiver logado, segue direto */
  if (Auth.alunoLogado()) { window.location.href = 'painel.html'; return; }
  if (Auth.adminLogado() && new URLSearchParams(location.search).get('admin')) { window.location.href = 'admin.html'; return; }

  /* ---------- teclado virtual ---------- */
  let cpfDigitado = '';
  const display = document.getElementById('cpf-display');
  const erroCpf = document.getElementById('erro-cpf');

  function renderDisplay() {
    if (cpfDigitado.length === 0) {
      display.textContent = '_-_-_-';
      display.classList.add('vazio');
      return;
    }
    display.classList.remove('vazio');
    display.textContent = formataCPF(cpfDigitado) || cpfDigitado;
  }

  document.getElementById('teclado').addEventListener('click', (e) => {
    const tecla = e.target.closest('.tecla');
    if (!tecla) return;
    erroCpf.hidden = true;
    if (tecla.dataset.num !== undefined) {
      if (cpfDigitado.length < 11) {
        cpfDigitado += tecla.dataset.num;
        renderDisplay();
      }
    }
  });

  document.getElementById('tecla-apagar').addEventListener('click', () => {
    cpfDigitado = cpfDigitado.slice(0, -1);
    renderDisplay();
  });

  async function tentarEntrar() {
    erroCpf.hidden = true;

    if (cpfDigitado.length !== 11) {
      erroCpf.textContent = 'Digite os 11 algarismos do seu CPF.';
      erroCpf.hidden = false;
      return;
    }
    if (!validaCPF(cpfDigitado)) {
      erroCpf.textContent = 'CPF inválido. Confira os números.';
      erroCpf.hidden = false;
      return;
    }

    let aluno;
    try {
      aluno = await DB.alunos.findByCpf(cpfDigitado);
    } catch (err) {
      erroCpf.textContent = 'Erro de conexão com o banco. Tente novamente.';
      erroCpf.hidden = false;
      console.error(err);
      return;
    }

    if (!aluno) {
      erroCpf.textContent = 'CPF não encontrado. Procure a secretaria para se cadastrar.';
      erroCpf.hidden = false;
      return;
    }
    if (!aluno.ativo) {
      erroCpf.textContent = 'Cadastro inativo. Fale com a secretaria.';
      erroCpf.hidden = false;
      return;
    }

    Auth.loginAluno(aluno);
    window.location.href = 'painel.html';
  }

  document.getElementById('tecla-entrar').addEventListener('click', tentarEntrar);

  /* teclado físico também funciona */
  document.addEventListener('keydown', (e) => {
    if (e.key >= '0' && e.key <= '9' && cpfDigitado.length < 11) {
      cpfDigitado += e.key;
      renderDisplay();
      erroCpf.hidden = true;
    } else if (e.key === 'Backspace') {
      cpfDigitado = cpfDigitado.slice(0, -1);
      renderDisplay();
    } else if (e.key === 'Enter') {
      tentarEntrar();
    }
  });

  /* ---------- modal admin ---------- */
  const modal = document.getElementById('modal-admin');
  const erroAdmin = document.getElementById('erro-admin');

  document.getElementById('link-admin').addEventListener('click', () => {
    modal.hidden = false;
    document.getElementById('usuario').focus();
  });
  document.getElementById('fechar-modal').addEventListener('click', () => {
    modal.hidden = true;
    erroAdmin.hidden = true;
  });
  modal.addEventListener('click', (e) => { if (e.target === modal) modal.hidden = true; });

  document.getElementById('form-admin').addEventListener('submit', async (e) => {
    e.preventDefault();
    erroAdmin.hidden = true;

    const usuario = document.getElementById('usuario').value.trim();
    const senha = document.getElementById('senha').value;

    try {
      if (await DB.admins.login(usuario, senha)) {
        const admin = await DB.admins.find(usuario);
        Auth.loginAdmin(admin);
        window.location.href = 'admin.html';
      } else {
        erroAdmin.textContent = 'Usuário ou senha incorretos.';
        erroAdmin.hidden = false;
      }
    } catch (err) {
      erroAdmin.textContent = 'Erro de conexão com o banco. Tente novamente.';
      erroAdmin.hidden = false;
      console.error(err);
    }
  });
})();

</script>
  <script>
/* =========================================================
   ABCDETRAN — Leitura em áudio (Web Speech API)
   Botão flutuante 🔊 lê os elementos com [data-audio].
   Usa as vozes do próprio sistema: funciona offline.
   ========================================================= */
(() => {
  const temVoz = 'speechSynthesis' in window;
  let lendo = false;
  let btn = null;

  function textoDe(el) {
    const clone = el.cloneNode(true);
    clone.querySelectorAll('[aria-hidden="true"], script, style').forEach(n => n.remove());
    return clone.textContent.replace(/\s+/g, ' ').trim();
  }

  function textosParaLer() {
    return [...document.querySelectorAll('[data-audio]')]
      .filter(e => e.offsetParent !== null)
      .map(textoDe)
      .filter(Boolean)
      .join('. ');
  }

  function falar() {
    if (!temVoz) return;
    parar();
    const texto = textosParaLer();
    if (!texto) return;
    const u = new SpeechSynthesisUtterance(texto);
    u.lang = 'pt-BR';
    u.rate = 1;
    const voz = speechSynthesis.getVoices().find(v => v.lang && v.lang.toLowerCase().startsWith('pt'));
    if (voz) u.voice = voz;
    u.onend = () => { lendo = false; atualiza(); };
    u.onerror = () => { lendo = false; atualiza(); };
    lendo = true;
    atualiza();
    speechSynthesis.speak(u);
  }

  function parar() {
    if (temVoz) speechSynthesis.cancel();
    lendo = false;
    atualiza();
  }

  function atualiza() {
    if (!btn) return;
    btn.textContent = lendo ? '⏹' : '🔊';
    btn.title = lendo ? 'Parar leitura' : 'Ouvir o conteúdo da página';
    btn.setAttribute('aria-label', btn.title);
    btn.classList.toggle('tocando', lendo);
  }

  function init() {
    if (!temVoz) return;
    btn = document.createElement('button');
    btn.className = 'btn-audio';
    btn.type = 'button';
    atualiza();
    btn.addEventListener('click', () => (lendo ? parar() : falar()));
    document.body.appendChild(btn);
    window.addEventListener('beforeunload', () => { if (temVoz) speechSynthesis.cancel(); });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();

</script>
