<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><title>Prévia das placas</title>
<style>body{font-family:sans-serif;background:#eef3f5;padding:20px}h1{color:#1e3a5f}.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}.c{background:#fff;border:1px solid #d9dee3;border-radius:10px;padding:12px;text-align:center;font-size:12px;color:#333}.c img{width:110px;height:100px;object-fit:contain}</style>
</head>
<body>
<h1>Prévia final das 30 placas</h1>
<div class="g" id="g"></div>
<script src="js/placas.js"></script>
<script>
const g = document.getElementById('g');
Object.entries(PLACAS).forEach(([k, f]) => {
  const d = document.createElement('div');
  d.className = 'c';
  const img = document.createElement('img');
  img.src = 'assets/placas/' + f;
  img.alt = k;
  d.appendChild(img);
  const b = document.createElement('div');
  b.innerHTML = '<b>' + k + '</b>';
  d.appendChild(b);
  g.appendChild(d);
});
</script>
</body>
</html>
